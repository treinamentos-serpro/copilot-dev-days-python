<div id="game-container" class="arcade-shell arcade-start">
    <main class="arcade-start-layout">
        <div class="arcade-brand arcade-reveal arcade-delay-1">
            <span class="arcade-eyebrow">PLAYER 01 // READY</span>
            <h1 class="arcade-title">Soc Ops</h1>
            <p class="arcade-subtitle">Social Bingo</p>
        </div>

        <section class="arcade-panel arcade-panel-start arcade-reveal arcade-delay-2">
            <div class="arcade-panel-heading">
                <span class="arcade-pixel-mark">?</span>
                <h2>How to play</h2>
            </div>
            <ul class="arcade-instructions">
                <li>Find people who match the questions</li>
                <li>Tap a square when you find a match</li>
                <li>Get 5 in a row to win!</li>
            </ul>
        </section>

        <button
            hx-post="/start"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="arcade-button arcade-button-primary arcade-reveal arcade-delay-3">
            <span>Start Game</span><span class="arcade-button-arrow">&gt;&gt;</span>
        </button>

            <p class="arcade-footer arcade-reveal arcade-delay-3">INSERT COURAGE // PRESS START</p>
        </main>
</div>
