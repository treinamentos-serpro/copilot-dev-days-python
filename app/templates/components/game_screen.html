<div id="game-container" class="arcade-shell arcade-game">
<div class="arcade-game-layout">
    <header class="arcade-header">
        <button
            hx-post="/reset"
            hx-target="#game-container"
            hx-swap="outerHTML"
            class="arcade-button arcade-button-back">
            <span>&lt;&lt;</span> ← Back
        </button>
        <h1 class="arcade-header-title">SOC OPS <span>//</span> BINGO</h1>
        <div class="arcade-score"><span class="arcade-score-label">SCORE</span><strong>0000</strong></div>
    </header>

    <p class="arcade-instruction-line">
        Tap a square when you find someone who matches it.
    </p>

    {% if session.has_bingo %}
    <div class="arcade-banner">
        <span class="arcade-banner-star">*</span> BINGO! You got a line! <span class="arcade-banner-star">*</span>
    </div>
    {% endif %}

    <div class="arcade-board-zone">
        {% include "components/bingo_board.html" %}
    </div>
</div>

{% if session.show_bingo_modal %}
    {% include "components/bingo_modal.html" %}
{% endif %}
</div>
