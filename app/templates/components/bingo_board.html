<div class="arcade-board" aria-label="Bingo board">
    {% for square in session.board %}
    {% set is_winning = square.id in session.winning_square_ids %}
    <button
        {% if not square.is_free_space %}
        hx-post="/toggle/{{ square.id }}"
        hx-target="#game-container"
        hx-swap="outerHTML"
        {% endif %}
        {% if square.is_free_space %}disabled{% endif %}
        class="arcade-square relative flex items-center justify-center p-1 text-center border transition-all duration-150 select-none min-h-[60px] leading-tight
        {%- if square.is_marked %}
            {%- if is_winning %} arcade-square-winning
            {%- else %} arcade-square-marked
            {%- endif %}
        {%- else %} arcade-square-open
        {%- endif %}
        {%- if square.is_free_space %} arcade-square-free{% endif %}"
        aria-pressed="{{ 'true' if square.is_marked else 'false' }}"
        aria-label="{{ 'Free space' if square.is_free_space else square.text }}">
        <span class="arcade-square-text wrap-break-word hyphens-auto">{{ square.text }}</span>
        {% if square.is_marked and not square.is_free_space %}
        <span class="arcade-check absolute top-0.5 right-0.5">X</span>
        {% endif %}
    </button>
    {% endfor %}
</div>
